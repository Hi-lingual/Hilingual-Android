name: Deploy to Play Store

# Release Publish 워크플로에서 호출되거나, 수동으로 재시도할 때만 실행된다.
# main push 트리거를 두지 않는 이유: main 은 배포가 성공한 뒤에 옮기는 브랜치이므로
# main 이 움직였다는 것은 이미 배포가 끝났다는 뜻이다.
on:
  workflow_call:
    inputs:
      ref:
        description: '빌드할 커밋 SHA 또는 브랜치'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: '빌드할 커밋 SHA 또는 브랜치 (기본: main)'
        required: false
        default: 'main'
        type: string

jobs:
  deploy_release:
    name: Build & Upload to Play Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.0'
          bundler-cache: true

      - name: Create Secrets Files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          printf "%s" "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf "%s" "$LOCAL_PROPERTIES" > local.properties
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/hilingual-release-key.jks
          printf "%s" "$PLAY_STORE_JSON_KEY" > play_store_api_key.json

      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      - name: Upload to Play Store
        run: bundle exec fastlane android upload_production
        env:
          PLAY_STORE_JSON_KEY_FILE: "${{ github.workspace }}/play_store_api_key.json"
          # [수정] AAB 파일 절대 경로 환경변수 추가
          PLAY_STORE_AAB_FILE: "${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab"
