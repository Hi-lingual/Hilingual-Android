name: Hilingual PR CI

on:
    pull_request:
        branches: [ develop, main ]
        # 봇이 연 draft PR 은 opened 이벤트로 CI 가 돌지 않는다.
        # 사람이 Ready for review 로 바꾸는 시점에 반드시 한 번은 검증되도록 한다.
        types: [ opened, synchronize, reopened, ready_for_review ]
    push:
        branches: [ develop ]

jobs:
    lint:
        name: PR Lint Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Set up JDK 17
              uses: actions/setup-java@v6
              with:
                  java-version: 17
                  distribution: 'temurin'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Create local.properties from secret
              env:
                  LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
              run: |
                  printf "%s" "$LOCAL_PROPERTIES" > local.properties
                  echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

            - name: Grant permission to gradlew
              run: chmod +x ./gradlew

            - name: Run ktlint
              run: ./gradlew ktlintCheck

    build:
        name: PR Build Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Set up JDK 17
              uses: actions/setup-java@v6
              with:
                  java-version: 17
                  distribution: 'temurin'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Create local.properties from secret
              env:
                  LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
              run: |
                  printf "%s" "$LOCAL_PROPERTIES" > local.properties
                  echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

            - name: Decode and install debug keystore
              env:
                  DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
              run: |
                  mkdir -p ./keystore
                  echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ./keystore/hilingual-debug-key.jks

            - name: Create google-services.json
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: |
                  printf "%s" "$GOOGLE_SERVICES_JSON" > ./app/google-services.json

            - name: Grant permission to gradlew
              run: chmod +x ./gradlew

            - name: Build with Gradle
              run: ./gradlew :app:assembleDebug --stacktrace

    release_build:
        name: Release Build Check
        # 릴리즈 PR 에서만 실행한다.
        # QA 는 debug APK 로 도는데 스토어에 올라가는 것은 R8 이 적용된 release AAB 라,
        # R8 관련 문제는 배포 단계에 가서야 드러난다. 머지 전에 미리 잡는다.
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Set up JDK 17
              uses: actions/setup-java@v6
              with:
                  java-version: 17
                  distribution: 'temurin'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Create required files from secrets
              env:
                  LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
                  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
              run: |
                  printf "%s" "$LOCAL_PROPERTIES" > local.properties
                  echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
                  printf "%s" "$GOOGLE_SERVICES_JSON" > ./app/google-services.json
                  mkdir -p ./keystore
                  echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > ./keystore/hilingual-release-key.jks

            - name: Grant permission to gradlew
              run: chmod +x ./gradlew

            - name: Build release bundle
              run: ./gradlew :app:bundleRelease --stacktrace
